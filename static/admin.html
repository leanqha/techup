<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        section { margin-bottom: 40px; }
        input, select { margin: 5px 0; padding: 5px; width: 250px; }
        button { padding: 5px 10px; margin: 5px 0; }
        pre { background: #f0f0f0; padding: 10px; }
    </style>
</head>
<body>
<h1>TechUp Admin Panel</h1>

<!-- JWT Token -->
<div>
    <h2>Login</h2>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPassword" placeholder="Password">
    <button onclick="login()">Login</button>
    <div id="loginMessage"></div>
</div>

<hr>

<section id="facultiesSection">
    <h2>Faculties</h2>
    <input type="text" id="facultyName" placeholder="Faculty Name">
    <button onclick="addFaculty()">Add Faculty</button>
    <button onclick="listFaculties()">List Faculties</button>
    <pre id="facultiesList"></pre>
</section>

<section id="groupsSection">
    <h2>Groups</h2>
    <input type="text" id="groupName" placeholder="Group Name">
    <input type="number" id="groupCourse" placeholder="Course">
    <input type="text" id="groupDegree" placeholder="Degree">
    <input type="number" id="groupFacultyId" placeholder="Faculty ID">
    <button onclick="addGroup()">Add Group</button>
    <button onclick="listGroups()">List Groups</button>
    <pre id="groupsList"></pre>
</section>

<section id="lessonsSection">
    <h2>Lessons</h2>
    <input type="text" id="lessonSubject" placeholder="Subject">
    <input type="number" id="lessonGroupId" placeholder="Group ID">
    <input type="text" id="lessonTeacher" placeholder="Teacher">
    <input type="text" id="lessonDay" placeholder="Day">
    <input type="text" id="lessonStart" placeholder="Start Time">
    <input type="text" id="lessonEnd" placeholder="End Time">
    <button onclick="addLesson()">Add Lesson</button>
    <button onclick="listLessons()">List Lessons</button>
    <pre id="lessonsList"></pre>
</section>

<script>
    const apiBase = "http://localhost:8080/api/v1";
    let token = "";

    // ----------------- Auth -----------------
    function login() {
        const data = {
            email: document.getElementById("loginEmail").value,
            password: document.getElementById("loginPassword").value
        };
        fetch(`${apiBase}/account/login`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(data)
        }).then(r => r.json()).then(res => {
            if(res.access_token) {
                token = res.access_token;
                document.getElementById("loginMessage").innerText = "Logged in";
            } else {
                document.getElementById("loginMessage").innerText = JSON.stringify(res);
            }
        });
    }

    // ----------------- Faculties -----------------
    function addFaculty() {
        const data = { name: document.getElementById("facultyName").value };
        fetch(`${apiBase}/admin/faculty`, {
            method: "POST",
            headers: {"Content-Type": "application/json", "Authorization": "Bearer " + token},
            body: JSON.stringify(data)
        }).then(r => r.json()).then(res => {
            alert(JSON.stringify(res));
        });
    }

    function listFaculties() {
        fetch(`${apiBase}/schedule/faculties`, {
            headers: {"Authorization": "Bearer " + token}
        }).then(r => r.json()).then(res => {
            document.getElementById("facultiesList").innerText = JSON.stringify(res, null, 2);
        });
    }

    // ----------------- Groups -----------------
    function addGroup() {
        const data = {
            name: document.getElementById("groupName").value,
            course: parseInt(document.getElementById("groupCourse").value),
            degree: document.getElementById("groupDegree").value,
            faculty_id: parseInt(document.getElementById("groupFacultyId").value)
        };
        fetch(`${apiBase}/admin/group`, {
            method: "POST",
            headers: {"Content-Type": "application/json", "Authorization": "Bearer " + token},
            body: JSON.stringify(data)
        }).then(r => r.json()).then(res => alert(JSON.stringify(res)));
    }

    function listGroups() {
        fetch(`${apiBase}/schedule/groups`, {
            headers: {"Authorization": "Bearer " + token}
        }).then(r => r.json()).then(res => {
            document.getElementById("groupsList").innerText = JSON.stringify(res, null, 2);
        });
    }

    // ----------------- Lessons -----------------
    function addLesson() {
        const data = {
            subject: document.getElementById("lessonSubject").value,
            group_id: parseInt(document.getElementById("lessonGroupId").value),
            teacher: document.getElementById("lessonTeacher").value,
            day_of_week: document.getElementById("lessonDay").value,
            start_time: document.getElementById("lessonStart").value,
            end_time: document.getElementById("lessonEnd").value
        };
        fetch(`${apiBase}/admin/lesson`, {
            method: "POST",
            headers: {"Content-Type": "application/json", "Authorization": "Bearer " + token},
            body: JSON.stringify(data)
        }).then(r => r.json()).then(res => alert(JSON.stringify(res)));
    }

    function listLessons() {
        fetch(`${apiBase}/schedule/lessons`, {
            headers: {"Authorization": "Bearer " + token}
        }).then(r => r.json()).then(res => {
            document.getElementById("lessonsList").innerText = JSON.stringify(res, null, 2);
        });
    }
</script>
</body>
</html>
