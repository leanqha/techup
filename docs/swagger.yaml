basePath: /
definitions:
  account.ChangePasswordRequest:
    properties:
      new_password:
        example: newpass123
        type: string
      old_password:
        example: currentpass
        type: string
    type: object
  account.LoginRequest:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: strongpassword
        type: string
    type: object
  account.LoginResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  account.ProfileResponse:
    properties:
      email:
        example: user@example.com
        type: string
      first_name:
        example: John
        type: string
      id:
        example: 1
        type: integer
      last_name:
        example: Doe
        type: string
      role:
        example: student
        type: string
      uid:
        example: "123456"
        type: string
    type: object
  account.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  account.RegisterRequest:
    properties:
      email:
        example: user@example.com
        type: string
      first_name:
        example: John
        type: string
      last_name:
        example: Doe
        type: string
      password:
        example: strongpassword
        type: string
    type: object
  account.SetRoleRequest:
    properties:
      role:
        example: teacher
        type: string
      user_id:
        example: 7
        type: integer
    type: object
  account.UpdateProfileRequest:
    properties:
      email:
        example: newemail@example.com
        type: string
      first_name:
        example: John
        type: string
      last_name:
        example: Doe
        type: string
    type: object
  schedule.Faculty:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  schedule.Group:
    properties:
      course:
        type: integer
      degree:
        description: бакалавриат / магистратура
        type: string
      facultyID:
        type: integer
      id:
        type: integer
      isActive:
        type: boolean
      name:
        type: string
      specialization:
        type: string
      yearStart:
        type: integer
    type: object
  schedule.Lesson:
    properties:
      classroom:
        type: string
      createdAt:
        type: string
      dayOfWeek:
        type: string
      endTime:
        type: string
      groupName:
        type: string
      id:
        type: integer
      isEvenWeek:
        type: boolean
      isOnline:
        type: boolean
      startTime:
        type: string
      subject:
        type: string
      teacher:
        type: string
    type: object
  schedule.TeacherScheduleResponse:
    properties:
      lessons:
        items:
          $ref: '#/definitions/schedule.Lesson'
        type: array
      teacher:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Backend API for the TechUp university application.
  title: TechUp API
  version: "1.0"
paths:
  /account/change-password:
    post:
      consumes:
      - application/json
      description: Allows a logged-in user to change their password
      parameters:
      - description: Old and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/account.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password changed successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid input
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Change user password
      tags:
      - account
  /account/set-role:
    post:
      consumes:
      - application/json
      description: Allows admin to set the role of another user
      parameters:
      - description: User ID and new role
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/account.SetRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Role updated successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid input
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Set user role
      tags:
      - account
  /account/update:
    put:
      consumes:
      - application/json
      description: Allows a logged-in user to update profile information
      parameters:
      - description: Profile update info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/account.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated profile
          schema:
            $ref: '#/definitions/account.ProfileResponse'
        "400":
          description: Invalid input
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Email already exists
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - account
  /api/v1/schedule/teacher/{teacher_name}:
    get:
      description: Returns all lessons taught by a specific teacher
      parameters:
      - description: Teacher's full name
        in: path
        name: teacher_name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schedule.TeacherScheduleResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get schedule by teacher name
      tags:
      - Schedule
  /login:
    post:
      consumes:
      - application/json
      description: Authenticates user and returns JWT token
      parameters:
      - description: User login info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/account.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: JWT tokens
          schema:
            $ref: '#/definitions/account.LoginResponse'
        "400":
          description: Invalid input
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid credentials
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User login
      tags:
      - account
  /profile:
    get:
      description: Returns current user info based on JWT token
      produces:
      - application/json
      responses:
        "200":
          description: User profile
          schema:
            $ref: '#/definitions/account.ProfileResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - account
  /refresh:
    post:
      consumes:
      - application/json
      description: Refreshes access and refresh tokens using a valid refresh token
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/account.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: New tokens
          schema:
            $ref: '#/definitions/account.LoginResponse'
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh JWT tokens
      tags:
      - account
  /register:
    post:
      consumes:
      - application/json
      description: Creates a new user account with role "student"
      parameters:
      - description: User registration info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/account.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid input
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - account
  /schedule:
    get:
      consumes:
      - application/json
      description: Get lessons schedule for a specific group
      parameters:
      - description: Group name
        in: query
        name: group
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: lessons
          schema:
            additionalProperties: true
            type: object
        "400":
          description: group query parameter is required
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: failed to get lessons
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get schedule by group
      tags:
      - schedule
  /schedule/faculty:
    post:
      consumes:
      - application/json
      description: Add a new faculty
      parameters:
      - description: Faculty to add
        in: body
        name: faculty
        required: true
        schema:
          $ref: '#/definitions/schedule.Faculty'
      produces:
      - application/json
      responses:
        "200":
          description: faculty added
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: failed to add faculty
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Add a faculty
      tags:
      - schedule
  /schedule/group:
    post:
      consumes:
      - application/json
      description: Add a new group
      parameters:
      - description: Group to add
        in: body
        name: group
        required: true
        schema:
          $ref: '#/definitions/schedule.Group'
      produces:
      - application/json
      responses:
        "200":
          description: group added
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: failed to add group
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Add a group
      tags:
      - schedule
  /schedule/lesson:
    post:
      consumes:
      - application/json
      description: Add a new lesson to the schedule
      parameters:
      - description: Lesson to add
        in: body
        name: lesson
        required: true
        schema:
          $ref: '#/definitions/schedule.Lesson'
      produces:
      - application/json
      responses:
        "200":
          description: lesson added
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: failed to add lesson
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Add a lesson
      tags:
      - schedule
  /schedule/upload:
    post:
      consumes:
      - multipart/form-data
      description: Upload a schedule file in PDF or Excel format
      parameters:
      - description: Schedule file (PDF or Excel)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: schedule uploaded and imported successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: file is required or invalid file type
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: failed to save file or import lessons
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Upload schedule file
      tags:
      - schedule
schemes:
- http
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
