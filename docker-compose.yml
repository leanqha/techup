services:
  # Postgres. `make db-up` starts just this (local dev); in the full stack
  # (`--profile app`) the app and migrations talk to it over the compose network.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-techup_db}
    ports:
      # Bound to localhost so the DB is never exposed to the public interface;
      # host-based dev migrations (make migrate) still reach it via localhost.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-techup_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Run DB migrations once, then exit. The app waits for it to finish.
  # Reuses the image built by the `app` service (below) — only one service
  # builds the shared image to avoid a duplicate-tag build conflict.
  migrate:
    profiles: ["app"]
    image: techup-api:local
    env_file:
      - ${ENV_FILE:-.env.dev}
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - >
        GOOSE_DRIVER=postgres
        GOOSE_DBSTRING="host=$${DB_HOST} port=$${DB_PORT} user=$${DB_USER} password=$${DB_PASSWORD} dbname=$${DB_NAME} sslmode=$${DB_SSLMODE}"
        goose -dir ./migrations up
    restart: "no"

  # The API. Runs the full stack with `docker compose --profile app up -d --build`.
  app:
    profiles: ["app"]
    image: techup-api:local
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${ENV_FILE:-.env.dev}
    environment:
      # Reach the db service over the compose network instead of localhost.
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      # Bound to localhost; the public entrypoint is nginx, which proxies /api here.
      - "127.0.0.1:${PORT:-3000}:3000"
    restart: unless-stopped
    command: ["./server"]

volumes:
  db_data:
