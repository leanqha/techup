services:
  db:
    image: postgres:16-alpine
    container_name: techup-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techup-api
    env_file:
      - ${ENV_FILE:-.env}
    ports:
      - "${PORT}:3000"
    restart: unless-stopped
    command: ["./server"]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  notification-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techup-notification-worker
    env_file:
      - ${ENV_FILE:-.env}
    restart: unless-stopped
    command: ["./notification-worker"]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: techup-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  db_data:
  rabbitmq_data:
