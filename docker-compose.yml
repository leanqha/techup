services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techup-api
    env_file:
      - ${ENV_FILE:-.env}
    ports:
      - "${PORT}:3000"
    restart: unless-stopped
    command: ["./server"]
    depends_on:
      - rabbitmq

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: techup-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  db_data:
  rabbitmq_data:
